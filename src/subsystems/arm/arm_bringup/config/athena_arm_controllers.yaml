/**/manual_end_effector_gripper_claw_controller:
  ros__parameters:
    velocity_joints:
      - gripper_claw
    position_joints:
      - actuator
    # interface_name: velocity
    joint_max_velocities:
      - 0.005       # TODO: Find this
