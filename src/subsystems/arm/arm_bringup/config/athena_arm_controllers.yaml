/**/two_dof_motor_status_controller:
  ros__parameters:
    joints:
      - base_yaw
      - shoulder_pitch
      - elbow_pitch
      - wrist_pitch
      - wrist_roll
      - actuator
      - gripper_claw
      - cam_0
      - cam_1
    gpios:
      - limit_switch_0
      - limit_switch_1
      - limit_switch_2
      - limit_switch_3
      - limit_switch_4
    command_interfaces:
      gripper_claw:
        interfaces:
          - status_request
      limit_switch_0:
        interfaces:
          - status_request
      limit_switch_1:
        interfaces:
          - status_request
      limit_switch_2:
        interfaces:
          - status_request
      limit_switch_3:
        interfaces:
          - status_request
      limit_switch_4:
        interfaces:
          - status_request
    state_interfaces:
      actuator:
        interfaces:
          - status
      cam_0:
        interfaces:
          - status
      cam_1:
        interfaces:
          - status
      limit_switch_0:
        interfaces:
          - status
      limit_switch_1:
        interfaces:
          - status
      limit_switch_2:
        interfaces:
          - status
      limit_switch_3:
        interfaces:
          - status
      limit_switch_4:
        interfaces:
          - status
    publish_rate: 10.0

